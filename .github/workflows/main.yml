name: CI

on: [push, pull_request]

jobs:
  allTests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Build and test
        run: mvn --batch-mode verify
